<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-FS MIDI Controller & 32×8 LED Simulator</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #20242e;
      --border: #2c313d;
      --text: #eef1f6;
      --muted: #9aa3b2;
      --led-color: #ff3b3b;
      --led-off: #221416;
      --ok: #2ecc71;
      --led-size: clamp(6px, 2.15vw, 16px);
      --led-gap: clamp(1px, 0.5vw, 4px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: clamp(10px, 3vw, 20px);
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(1.1rem, 4.2vw, 1.35rem);
      margin: 0;
    }

    .sub {
      color: var(--muted);
      font-size: clamp(0.78rem, 3vw, 0.88rem);
      margin-top: 3px;
    }

    .toolbar, .sim-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.84rem;
      transition: 0.15s ease;
    }

    button:hover {
      border-color: #4b5366;
      background: #272c38;
    }

    button.primary {
      background: #e63946;
      border-color: #e63946;
      color: #fff;
    }

    button.primary:hover {
      background: #d62839;
    }

    button.active-toggle {
      border-color: var(--ok);
      color: var(--ok);
    }

    .matrix-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: clamp(10px, 3vw, 18px);
      margin-bottom: 18px;
    }

    .matrix-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .matrix-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .matrix-chassis {
      background: #08090c;
      padding: clamp(6px, 1.8vw, 14px);
      border-radius: 10px;
      border: 2px solid #2b303c;
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.85);
      max-width: 100%;
    }

    .matrix-board {
      display: grid;
      grid-template-columns: repeat(32, var(--led-size));
      gap: var(--led-gap);
      touch-action: none;
    }

    .led {
      width: var(--led-size);
      height: var(--led-size);
      border-radius: 50%;
      background: var(--led-off);
      cursor: crosshair;
      transition: background 0.05s ease, box-shadow 0.05s ease;
    }

    .led.mod-edge {
      margin-right: clamp(1px, 0.5vw, 4px);
    }

    .led.on {
      background: var(--led-color);
      box-shadow: 0 0 8px var(--led-color);
    }

    .sim-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted);
    }

    .sim-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .grid-8 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card.active {
      border-color: var(--led-color);
      box-shadow: 0 0 0 1px rgba(255, 59, 59, 0.25);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fs-badge {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ff8585;
    }

    .gpio-tag {
      font-size: 0.76rem;
      color: var(--muted);
      background: var(--panel-2);
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.79rem;
      color: var(--muted);
    }

    input[type="text"], input[type="number"], select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 0.86rem;
    }

    input[type="range"] {
      accent-color: #e63946;
      cursor: pointer;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .card-actions button {
      flex: 1;
      padding: 7px 10px;
      font-size: 0.82rem;
    }

    .pedal-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    @media (min-width: 760px) {
      .pedal-bar {
        grid-template-columns: repeat(8, 1fr);
      }
    }

    .stomp-btn {
      background: #1d212b;
      border: 2px solid #353b4a;
      border-radius: 10px;
      padding: 9px 6px;
      text-align: center;
      cursor: pointer;
    }

    .stomp-btn:active, .stomp-btn.pressed {
      transform: translateY(2px);
      border-color: var(--led-color);
      background: #272228;
    }

    .stomp-cap {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin: 0 auto 6px;
      background: radial-gradient(circle at 35% 35%, #e5e9f0, #7b8494);
      border: 2px solid #49505e;
    }

    .stomp-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-bar {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ok-text {
      color: var(--ok);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>8-Footswitch MIDI Controller & 32×8 LED Simulator</h1>
        <div class="sub">4× MAX7219 (128×32 mm) Screen Simulator + MIDI CC/PC Configurator</div>
      </div>
      <div class="toolbar">
        <button id="saveBtn" class="primary">Save Settings</button>
        <button id="exportBtn">Export JSON</button>
        <button id="copyBytesBtn">Copy C++ Frame</button>
        <button id="resetBtn">Reset</button>
      </div>
    </header>

    <section class="matrix-box">
      <div class="matrix-top">
        <div>
          <strong>32×8 Dot Matrix Live Simulator</strong>
          <div class="sub" id="activePreviewInfo">Tap a footswitch below or touch/click LEDs to draw.</div>
        </div>
        <div class="sim-controls">
          <input id="customScreenText" type="text" maxlength="24" placeholder="Text (e.g. AM4 LEAD)" style="width:170px;" />
          <button id="sendCustomTextBtn">Show Text</button>
          <button id="scrollToggleBtn">Scroll: Off</button>
        </div>
      </div>

      <div class="matrix-wrap">
        <div class="matrix-chassis">
          <div id="matrixBoard" class="matrix-board" aria-label="32x8 LED display simulator"></div>
        </div>
      </div>

      <div class="sim-bar">
        <div class="sim-group">
          <button id="clearMatrixBtn">Clear</button>
          <button id="invertMatrixBtn">Invert</button>
          <button id="testPatternBtn">All On</button>
        </div>

        <div class="sim-group">
          <label style="flex-direction:row; align-items:center; gap:6px;">
            Brightness:
            <input id="brightnessRange" type="range" min="1" max="15" value="12" style="width:80px;" />
          </label>
          <label style="flex-direction:row; align-items:center; gap:6px;">
            Color:
            <select id="ledColorSelect">
              <option value="#ff3b3b|#221416" selected>Red</option>
              <option value="#2ecc71|#112218">Green</option>
              <option value="#ffaa00|#241d11">Amber</option>
              <option value="#38bdf8|#111d24">Blue</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <section class="pedal-bar" id="pedalBar"></section>

    <section id="switchesGrid" class="grid-8"></section>

    <div class="status-bar">
      <span id="lastMidiLog">Last MIDI: None yet</span>
      <span id="saveStatus" class="ok-text"></span>
    </div>
  </div>

  <script>
    const FONT_5X7 = {
      "A": ["01110","10001","10001","11111","10001","10001","10001"],
      "B": ["11110","10001","10001","11110","10001","10001","11110"],
      "C": ["01111","10000","10000","10000","10000","10000","01111"],
      "D": ["11110","10001","10001","10001","10001","10001","11110"],
      "E": ["11111","10000","10000","11110","10000","10000","11111"],
      "F": ["11111","10000","10000","11110","10000","10000","10000"],
      "G": ["01111","10000","10000","10111","10001","10001","01111"],
      "H": ["10001","10001","10001","11111","10001","10001","10001"],
      "I": ["11111","00100","00100","00100","00100","00100","11111"],
      "J": ["00111","00010","00010","00010","10010","10010","01100"],
      "K": ["10001","10010","10100","11000","10100","10010","10001"],
      "L": ["10000","10000","10000","10000","10000","10000","11111"],
      "M": ["10001","11011","10101","10101","10001","10001","10001"],
      "N": ["10001","11001","10101","10011","10001","10001","10001"],
      "O": ["01110","10001","10001","10001","10001","10001","01110"],
      "P": ["11110","10001","10001","11110","10000","10000","10000"],
      "Q": ["01110","10001","10001","10001","10101","10010","01101"],
      "R": ["11110","10001","10001","11110","10100","10010","10001"],
      "S": ["01111","10000","10000","01110","00001","00001","11110"],
      "T": ["11111","00100","00100","00100","00100","00100","00100"],
      "U": ["10001","10001","10001","10001","10001","10001","01110"],
      "V": ["10001","10001","10001","10001","10001","01010","00100"],
      "W": ["10001","10001","10001","10101","10101","11011","10001"],
      "X": ["10001","10001","01010","00100","01010","10001","10001"],
      "Y": ["10001","10001","01010","00100","00100","00100","00100"],
      "Z": ["11111","00001","00010","00100","01000","10000","11111"],
      "0": ["01110","10011","10101","10101","11001","10001","01110"],
      "1": ["00100","01100","00100","00100","00100","00100","01110"],
      "2": ["01110","10001","00001","00110","01000","10000","11111"],
      "3": ["11110","00001","00001","01110","00001","00001","11110"],
      "4": ["00010","00110","01010","10010","11111","00010","00010"],
      "5": ["11111","10000","11110","00001","00001","10001","01110"],
      "6": ["01110","10000","11110","10001","10001","10001","01110"],
      "7": ["11111","00001","00010","00100","01000","01000","01000"],
      "8": ["01110","10001","10001","01110","10001","10001","01110"],
      "9": ["01110","10001","10001","01111","00001","00001","01110"],
      "-": ["00000","00000","00000","11111","00000","00000","00000"],
      "+": ["00000","00100","00100","11111","00100","00100","00000"],
      "/": ["00001","00010","00100","01000","10000","00000","00000"],
      ":": ["00000","00100","00100","00000","00100","00100","00000"],
      "!": ["00100","00100","00100","00100","00100","00000","00100"],
      " ": ["00000","00000","00000","00000","00000","00000","00000"]
    };

    const DEFAULT_CONFIG = [
      { id: 1, gpio: "GPIO 1", label: "CLEAN",  target: "AM4",     type: "CC", channel: 1, number: 10, value: 127 },
      { id: 2, gpio: "GPIO 2", label: "DRIVE",  target: "AM4",     type: "CC", channel: 1, number: 11, value: 127 },
      { id: 3, gpio: "GPIO 3", label: "LEAD",   target: "AM4",     type: "CC", channel: 1, number: 12, value: 127 },
      { id: 4, gpio: "GPIO 4", label: "SOLO",   target: "AM4",     type: "CC", channel: 1, number: 13, value: 127 },
      { id: 5, gpio: "GPIO 5", label: "NANO 1", target: "NANO",    type: "PC", channel: 2, number: 0,  value: 127 },
      { id: 6, gpio: "GPIO 6", label: "NANO 2", target: "NANO",    type: "PC", channel: 2, number: 1,  value: 127 },
      { id: 7, gpio: "GPIO 7", label: "LOOP",   target: "ABLETON", type: "CC", channel: 3, number: 20, value: 127 },
      { id: 8, gpio: "GPIO 8", label: "TAP",    target: "ABLETON", type: "CC", channel: 3, number: 21, value: 127 }
    ];

    const STORAGE_KEY = "esp32s3_8fs_midi_sim_v3";
    let config = loadConfig();
    let activeSwitchId = 1;

    let frameBuffer = Array.from({ length: 8 }, () => Array(32).fill(false));
    let isDrawing = false;
    let drawState = true;
    let scrollTimer = null;
    let scrollText = "CLEAN";
    let scrollOffset = 0;

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return structuredClone(DEFAULT_CONFIG);
    }

    function saveConfig(showMsg = true) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      if (showMsg) {
        document.getElementById("saveStatus").textContent =
          "Saved (" + new Date().toLocaleTimeString() + ")";
      }
    }

    const matrixBoard = document.getElementById("matrixBoard");
    const leds = [];

    function startDrawAt(r, c) {
      stopScroll();
      isDrawing = true;
      drawState = !frameBuffer[r][c];
      frameBuffer[r][c] = drawState;
      syncBufferToDom();
    }

    function continueDrawAt(r, c) {
      if (!isDrawing) return;
      if (frameBuffer[r][c] !== drawState) {
        frameBuffer[r][c] = drawState;
        syncBufferToDom();
      }
    }

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 32; c++) {
        const dot = document.createElement("div");
        dot.className = "led" + ((c === 7 || c === 15 || c === 23) ? " mod-edge" : "");
        dot.dataset.r = r;
        dot.dataset.c = c;

        dot.addEventListener("mousedown", (e) => {
          e.preventDefault();
          startDrawAt(r, c);
        });

        dot.addEventListener("mouseenter", () => continueDrawAt(r, c));

        dot.addEventListener("touchstart", (e) => {
          e.preventDefault();
          startDrawAt(r, c);
        }, { passive: false });

        matrixBoard.appendChild(dot);
        leds.push(dot);
      }
    }

    matrixBoard.addEventListener("touchmove", (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      if (target && target.classList.contains("led")) {
        continueDrawAt(Number(target.dataset.r), Number(target.dataset.c));
      }
    }, { passive: false });

    window.addEventListener("mouseup", () => { isDrawing = false; });
    window.addEventListener("touchend", () => { isDrawing = false; });

    function syncBufferToDom() {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 32; c++) {
          leds[r * 32 + c].classList.toggle("on", frameBuffer[r][c]);
        }
      }
    }

    function textToColumns(text) {
      const clean = (text || "").toUpperCase();
      const cols = [];
      for (const ch of clean) {
        const glyph = FONT_5X7[ch] || FONT_5X7[" "];
        for (let col = 0; col < 5; col++) {
          const columnBits = [false];
          for (let row = 0; row < 7; row++) {
            columnBits.push(glyph[row][col] === "1");
          }
          cols.push(columnBits);
        }
        cols.push(Array(8).fill(false));
      }
      return cols;
    }

    function renderStaticText(text) {
      stopScroll();
      scrollText = (text || "").toUpperCase();
      frameBuffer = Array.from({ length: 8 }, () => Array(32).fill(false));

      const cols = textToColumns(scrollText);
      const startX = cols.length <= 32 ? Math.floor((32 - cols.length) / 2) : 0;

      for (let c = 0; c < cols.length && (startX + c) < 32; c++) {
        for (let r = 0; r < 8; r++) {
          frameBuffer[r][startX + c] = cols[c][r];
        }
      }
      syncBufferToDom();
    }

    function startScroll(text) {
      stopScroll();
      scrollText = (text || "MIDI CONTROLLER").toUpperCase();
      const baseCols = textToColumns(scrollText + "   ");
      if (baseCols.length === 0) return;

      scrollOffset = 0;
      const btn = document.getElementById("scrollToggleBtn");
      btn.textContent = "Scroll: On";
      btn.classList.add("active-toggle");

      scrollTimer = setInterval(() => {
        for (let c = 0; c < 32; c++) {
          const srcCol = baseCols[(scrollOffset + c) % baseCols.length];
          for (let r = 0; r < 8; r++) {
            frameBuffer[r][c] = srcCol[r];
          }
        }
        syncBufferToDom();
        scrollOffset = (scrollOffset + 1) % baseCols.length;
      }, 95);
    }

    function stopScroll() {
      if (scrollTimer) {
        clearInterval(scrollTimer);
        scrollTimer = null;
      }
      const btn = document.getElementById("scrollToggleBtn");
      btn.textContent = "Scroll: Off";
      btn.classList.remove("active-toggle");
    }

    function triggerSwitch(sw) {
      activeSwitchId = sw.id;
      document.querySelectorAll(".card").forEach(card => {
        card.classList.toggle("active", Number(card.dataset.id) === sw.id);
      });

      const stomp = document.querySelector(`.stomp-btn[data-id="${sw.id}"]`);
      if (stomp) {
        stomp.classList.add("pressed");
        setTimeout(() => stomp.classList.remove("pressed"), 140);
      }

      if (sw.label.length > 5) {
        startScroll(sw.label);
      } else {
        renderStaticText(sw.label);
      }

      document.getElementById("activePreviewInfo").textContent =
        `Active: FS${sw.id} (${sw.gpio}) → "${sw.label}"`;
      document.getElementById("lastMidiLog").textContent =
        `Last MIDI: [${sw.target}] Ch ${sw.channel} • ${sw.type} #${sw.number} (Val: ${sw.value})`;
    }

    function renderPedalBar() {
      const bar = document.getElementById("pedalBar");
      bar.innerHTML = "";
      config.forEach(sw => {
        const btn = document.createElement("div");
        btn.className = "stomp-btn";
        btn.dataset.id = sw.id;
        btn.innerHTML = `
          <div class="stomp-cap"></div>
          <div class="stomp-label">FS${sw.id}: ${sw.label}</div>
        `;
        btn.addEventListener("click", () => triggerSwitch(sw));
        bar.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById("switchesGrid");
      grid.innerHTML = "";

      config.forEach(sw => {
        const card = document.createElement("div");
        card.className = "card" + (sw.id === activeSwitchId ? " active" : "");
        card.dataset.id = sw.id;

        card.innerHTML = `
          <div class="card-head">
            <span class="fs-badge">FOOTSWITCH ${sw.id}</span>
            <span class="gpio-tag">${sw.gpio}</span>
          </div>

          <label>
            Screen Label (5+ chars scroll)
            <input type="text" maxlength="16" data-field="label" value="${sw.label}" />
          </label>

          <div class="row-2">
            <label>
              Target
              <select data-field="target">
                <option value="AM4" ${sw.target === "AM4" ? "selected" : ""}>Fractal AM4</option>
                <option value="NANO" ${sw.target === "NANO" ? "selected" : ""}>Nano Cortex</option>
                <option value="ABLETON" ${sw.target === "ABLETON" ? "selected" : ""}>Ableton Live</option>
              </select>
            </label>

            <label>
              Type
              <select data-field="type">
                <option value="CC" ${sw.type === "CC" ? "selected" : ""}>MIDI CC</option>
                <option value="PC" ${sw.type === "PC" ? "selected" : ""}>MIDI PC</option>
              </select>
            </label>
          </div>

          <div class="row-2">
            <label>
              Channel (1–16)
              <input type="number" min="1" max="16" data-field="channel" value="${sw.channel}" />
            </label>

            <label>
              ${sw.type === "PC" ? "PC # (0–127)" : "CC # (0–127)"}
              <input type="number" min="0" max="127" data-field="number" value="${sw.number}" />
            </label>
          </div>

          <div class="card-actions">
            <button type="button" class="test-btn">Trigger</button>
          </div>
        `;

        card.querySelectorAll("[data-field]").forEach(input => {
          input.addEventListener("input", () => {
            const field = input.dataset.field;
            if (field === "label") {
              sw.label = input.value.toUpperCase();
              input.value = sw.label;
              renderPedalBar();
              if (sw.id === activeSwitchId) triggerSwitch(sw);
            } else if (field === "channel") {
              sw.channel = Math.min(16, Math.max(1, Number(input.value) || 1));
            } else if (field === "number") {
              sw.number = Math.min(127, Math.max(0, Number(input.value) || 0));
            } else {
              sw[field] = input.value;
            }
            if (field === "type") renderGrid();
          });
        });

        card.querySelector(".test-btn").addEventListener("click", () => triggerSwitch(sw));
        grid.appendChild(card);
      });
    }

    document.getElementById("sendCustomTextBtn").addEventListener("click", () => {
      const txt = document.getElementById("customScreenText").value || "HELLO";
      if (txt.length > 5) startScroll(txt);
      else renderStaticText(txt);
    });

    document.getElementById("scrollToggleBtn").addEventListener("click", () => {
      if (scrollTimer) {
        renderStaticText(scrollText);
      } else {
        const txt = document.getElementById("customScreenText").value || scrollText || "AM4 MIDI";
        startScroll(txt);
      }
    });

    document.getElementById("clearMatrixBtn").addEventListener("click", () => {
      stopScroll();
      frameBuffer = Array.from({ length: 8 }, () => Array(32).fill(false));
      syncBufferToDom();
    });

    document.getElementById("invertMatrixBtn").addEventListener("click", () => {
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 32; c++) {
          frameBuffer[r][c] = !frameBuffer[r][c];
        }
      }
      syncBufferToDom();
    });

    document.getElementById("testPatternBtn").addEventListener("click", () => {
      stopScroll();
      frameBuffer = Array.from({ length: 8 }, () => Array(32).fill(true));
      syncBufferToDom();
    });

    document.getElementById("brightnessRange").addEventListener("input", (e) => {
      const val = Number(e.target.value);
      matrixBoard.style.opacity = (0.35 + (val / 15) * 0.65).toFixed(2);
    });

    document.getElementById("ledColorSelect").addEventListener("change", (e) => {
      const [onColor, offColor] = e.target.value.split("|");
      document.documentElement.style.setProperty("--led-color", onColor);
      document.documentElement.style.setProperty("--led-off", offColor);
    });

    document.getElementById("copyBytesBtn").addEventListener("click", async () => {
      const bytes = [];
      for (let c = 0; c < 32; c++) {
        let colByte = 0;
        for (let r = 0; r < 8; r++) {
          if (frameBuffer[r][c]) colByte |= (1 << r);
        }
        bytes.push("0x" + colByte.toString(16).padStart(2, "0").toUpperCase());
      }
      const snippet = `const uint8_t customFrame[32] = { ${bytes.join(", ")} };`;
      try {
        await navigator.clipboard.writeText(snippet);
        document.getElementById("saveStatus").textContent = "Copied 32-byte C++ array!";
      } catch (_) {
        prompt("Copy C++ array:", snippet);
      }
    });

    document.getElementById("saveBtn").addEventListener("click", () => saveConfig(true));

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(config, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "midi-footswitch-config.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      config = structuredClone(DEFAULT_CONFIG);
      saveConfig(false);
      renderPedalBar();
      renderGrid();
      triggerSwitch(config[0]);
      document.getElementById("saveStatus").textContent = "Reset to defaults.";
    });

    renderPedalBar();
    renderGrid();
    triggerSwitch(config[0]);
  </script>
</body>
</html>
